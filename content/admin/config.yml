backend:
  name: github
  repo: FranGoofy/tamasora
  branch: main
  base_url: https://sveltia-cms-auth.franbookmmo.workers.dev

media_folder: z_Images/uploads
public_folder: /z_Images/uploads

collections:
  - name: sxs_characters
    label: "SxS Player Characters"
    folder: "Characters/SxS PCs"
    create: true
    extension: md
    fields:
      - { label: "Publish to Wiki", name: "publish", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: scribes_characters
    label: "Scribes Player Characters"
    folder: "Characters/Scribes PCs"
    create: true
    extension: md
    fields:
      - { label: "Publish to Wiki", name: "publish", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: weastern_legends
    label: "Weastern Legends"
    folder: "Weastern Legends"
    create: true
    extension: md
    fields:
      - { label: "Publish to Wiki", name: "publish", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: wind_of_the_weast_pcs
    label: "Wind of the Weast PCs"
    folder: "Weastern Legends/Wind of the Weast PCs"
    create: true
    extension: md
    fields:
      - { label: "Publish to Wiki", name: "publish", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  # AUTO-GENERATED RECAPS START — do not edit by hand; regenerated by sync workflow
  - name: scribes
    label: "Scribes"
    folder: "a_Recaps/Scribes"
    create: true
    extension: md
    fields:
      - { label: "Publish to Wiki", name: "publish", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: solar_x_scions_recaps
    label: "Solar x Scions Recaps"
    folder: "a_Recaps/Solar x Scions Recaps"
    create: true
    extension: md
    fields:
      - { label: "Publish to Wiki", name: "publish", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }
  # AUTO-GENERATED RECAPS END
